<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="base.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Talent Show - My Profile</title>
  <meta name="description" content="View your UIU Talent Show profile, submissions, trophy shelf and performance stats." />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <div class="page">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <h1>UIU Talent Show</h1>
          <p>The Arena</p>
        </div>
      </div>

      <nav class="nav">
        <a href="home.html">🏠 Home</a>
        <a class="active" href="#">👤 My Profile</a>
        <a href="leaderboard.html">🏆 Leaderboard</a>
        <a href="categories.html">📂 Analytics</a>
        <a href="#">⚙ Settings</a>
      </nav>

      <button class="cta" id="sidebar-upload-btn">Upload Performance</button>

      <div class="sidebar-footer">
        <a href="#">Help</a>
        <a href="#">Logout</a>
      </div>
    </aside>

    <!-- ── Main Content ── -->
    <main class="content">

      <!-- Profile Banner (gradient hero) -->
      <div class="profile-banner">
        <!-- Decorative blobs (CSS) -->
        <div class="banner-body">
          <div class="profile-avatar avatar"></div>
          <div class="profile-meta">
            <div class="profile-name-row">
              <h2 class="profile-name">Alex Rivers</h2>
              <span class="verified-badge">✓ Verified</span>
            </div>
            <p class="profile-dept">Dept. of Multimedia and Creative Technology • Batch 2022</p>
          </div>
          <button class="edit-profile-btn">✏ Edit Profile</button>
        </div>
      </div>

      <!-- Talent label -->
      <div class="talent-row">
        <span class="tag">Singer and Producer</span>
      </div>

      <!-- Stats Row -->
      <section class="stats">
        <div class="stat">
          <strong>24</strong>
          <span>Posts</span>
        </div>
        <div class="stat">
          <strong>1.2k</strong>
          <span>Total Likes</span>
        </div>
        <div class="stat">
          <strong>348</strong>
          <span>Comments</span>
        </div>
        <div class="stat awards-stat">
          <strong>03</strong>
          <span>Awards</span>
        </div>
      </section>

      <!-- Filter Tabs -->
      <section class="tabs" id="profile-tabs">
        <button class="active">All Posts</button>
        <button>My Videos</button>
        <button>Audio</button>
        <button>Blogs</button>
        <button>Liked</button>
        <button>Saved</button>
      </section>

      <!-- Submissions Gallery -->
      <section class="gallery" id="profile-gallery">
        <!-- Dynamically populated -->
      </section>

    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
