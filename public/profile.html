<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Talent Show - Profile</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <h1>UIU Talent Show</h1>
          <p>The Arena</p>
        </div>
      </div>

      <nav class="nav">
        <a href="home.html">Home</a>
        <a class="active" href="#">My Profile</a>
        <a href="#">Submissions</a>
        <a href="#">Analytics</a>
        <a href="#">Settings</a>
      </nav>

      <button class="cta">Upload Performance</button>
    </aside>

    <main class="content">
      <section class="profile-hero">
        <div class="profile-info">
          <div class="avatar">Avatar</div>
          <div>
            <h2>Alex Rivers</h2>
            <p>Dept. of Multimedia and Creative Technology, Batch 2022</p>
            <span class="tag">Singer and Producer</span>
          </div>
        </div>
        <button class="ghost">Edit Profile</button>
      </section>

      <section class="stats">
        <div class="stat">
          <strong>24</strong>
          <span>Posts</span>
        </div>
        <div class="stat">
          <strong>1.2k</strong>
          <span>Total Likes</span>
        </div>
        <div class="stat">
          <strong>348</strong>
          <span>Comments</span>
        </div>
        <div class="stat">
          <strong>03</strong>
          <span>Awards</span>
        </div>
      </section>

      <section class="tabs">
        <button class="active">My Videos</button>
        <button>Audio</button>
        <button>Blogs</button>
        <button>Liked</button>
        <button>Saved</button>
      </section>

      <section class="gallery">
        <!-- Dynamic submissions will load here -->
      </section>
    </main>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
