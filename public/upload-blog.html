<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="base.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Talent Show - Upload Blog</title>
  <link rel="stylesheet" href="upload-blog.css" />
</head>
<body>
  <div class="modal-page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>UIU Talent Show</h1>
      </div>
      <nav class="tabs">
        <button onclick="window.location.href='upload-video.html'">Video</button>
        <button onclick="window.location.href='upload-audio.html'">Audio</button>
        <button class="active" onclick="window.location.href='upload-blog.html'">Blog</button>
      </nav>
    </header>

    <section class="modal">
      <div class="modal-header">
        <div>
          <h2>Upload Talent</h2>
          <p>Share your blog</p>
        </div>
        <button class="close" onclick="window.location.href='home.html'">X</button>
      </div>

      <div class="upload-area">
        <div class="icon">Cover</div>
        <p>Upload Cover Image</p>
        <span>Recommended 1200 x 450px</span>
        <button class="ghost" type="button">Select File</button>
      </div>

      <div class="grid">
        <label>Article Title<input type="text" id="upload-title" placeholder="Enter a captivating title" required /></label>
        <label>Tags<input type="text" id="upload-tags" placeholder="#Design #UI" /></label>
        <label>Category<select id="upload-category"><option>Creative Writing</option><option>Storytelling</option><option>Academic</option><option>Campus News</option></select></label>
      </div>

      <label class="editor">
        Content Body
        <textarea id="upload-content" placeholder="Start your masterpiece here. Use typography to make it stand out." required></textarea>
      </label>

      <div class="modal-footer">
        <div class="meta">
          <button class="ghost" onclick="window.location.href='home.html'" type="button">Cancel</button>
        </div>
        <div class="actions">
          <button class="primary" id="publish-btn" type="button">Publish to Arena</button>
        </div>
      </div>
    </section>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/uploads.js" defer></script>
</body>
</html>
