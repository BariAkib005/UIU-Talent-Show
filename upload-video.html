<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Talent Show - Upload Video</title>
  <link rel="stylesheet" href="upload-video.css" />
</head>
<body>
  <div class="center">
    <section class="modal">
      <div class="modal-header">
        <div>
          <h2>Share Your Talent</h2>
          <p>Ready for the spotlight?</p>
        </div>
        <button class="close">X</button>
      </div>

      <div class="tabs">
        <button class="active">Video</button>
        <button>Audio</button>
        <button>Blog</button>
      </div>

      <div class="drop">
        <div class="icon">Video</div>
        <strong>Drag & drop your masterpiece</strong>
        <span>MP4, MOV or AVI (max 500MB)</span>
        <button class="primary">Select File</button>
      </div>

      <label>Title<input type="text" placeholder="Give your act a catchy name" /></label>
      <div class="grid">
        <label>Category<select><option>Dance Performance</option></select></label>
        <label>Tags<input type="text" placeholder="#dance #cover" /></label>
      </div>
      <label>Description<textarea placeholder="Tell us about your preparation and what makes this special."></textarea></label>

      <div class="footer">
        <button class="ghost">Cancel</button>
        <button class="primary">Publish to Arena</button>
      </div>
    </section>
  </div>
</body>
</html>
