<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Talent Show - Choose Talent</title>
  <link rel="stylesheet" href="choose-talent.css" />
</head>
<body>
  <div class="overlay">
    <section class="card">
      <div class="left">
        <h2>Your Stage Awaits.</h2>
        <p>Join 2,000+ UIU students showcasing their unique brilliance.</p>
        <div class="progress">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="right">
        <span class="step">Step 1 of 2</span>
        <h3>What&apos;s your talent?</h3>
        <p>Select the primary medium of your expression.</p>
        <div class="options">
          <button class="option">
            <span class="icon">Video</span>
            <div>
              <strong>Video Performance</strong>
              <p>Dancing, acting, or cinematography</p>
            </div>
            <span class="arrow">&gt;</span>
          </button>
          <button class="option">
            <span class="icon">Audio</span>
            <div>
              <strong>Audio & Music</strong>
              <p>Singing, instruments, or podcasting</p>
            </div>
            <span class="arrow">&gt;</span>
          </button>
          <button class="option">
            <span class="icon">Blog</span>
            <div>
              <strong>Blog & Writing</strong>
              <p>Poetry, stories, or journalism</p>
            </div>
            <span class="arrow">&gt;</span>
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
