<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIU Talent Show - Upload Blog</title>
  <link rel="stylesheet" href="upload-blog.css" />
</head>
<body>
  <div class="modal-page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>UIU Talent Show</h1>
      </div>
      <nav class="tabs">
        <button>Video</button>
        <button>Audio</button>
        <button class="active">Blog</button>
      </nav>
    </header>

    <section class="modal">
      <div class="modal-header">
        <div>
          <h2>Upload Talent</h2>
          <p>Share your blog</p>
        </div>
        <button class="close">X</button>
      </div>

      <div class="upload-area">
        <div class="icon">Cover</div>
        <p>Upload Cover Image</p>
        <span>Recommended 1200 x 450px</span>
        <button class="ghost">Select File</button>
      </div>

      <div class="grid">
        <label>Article Title<input type="text" placeholder="Enter a captivating title" /></label>
        <label>Tags<input type="text" placeholder="#Design #UI" /></label>
        <label>Category<select><option>Creative Writing</option><option>Storytelling</option></select></label>
      </div>

      <label class="editor">
        Content Body
        <textarea placeholder="Start your masterpiece here. Use typography to make it stand out."></textarea>
      </label>

      <div class="modal-footer">
        <div class="meta">
          <button class="ghost">Save as Draft</button>
          <span>Last saved 2m ago</span>
        </div>
        <div class="actions">
          <button class="ghost">Preview</button>
          <button class="primary">Publish to Arena</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
